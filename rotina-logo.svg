<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      @font-face { font-family: 'Inter'; src: local('Inter'), local('Heebo'), local('Rubik'); }
      .bg { fill: #192537; }
      .word { font-family: 'Inter', 'Heebo', 'Rubik', sans-serif; font-weight: 800; font-size: 120px; fill: #FFFFFF; letter-spacing: 0.02em; animation: track 1800ms ease 200ms both; }
      .dot { fill: #AC9B7E; transform-origin: center; animation: dotHop 1600ms cubic-bezier(.2,.9,.2,1) 200ms forwards, pulse 2000ms ease-in-out 1900ms infinite; }
      .underline { stroke: #AC9B7E; stroke-width: 6; stroke-linecap: round; fill: none; stroke-dasharray: 540; stroke-dashoffset: 540; animation: draw 1600ms ease 300ms forwards; }
      @keyframes track {
        0% { opacity: 0; transform: translateY(16px); letter-spacing: -0.16em; }
        50% { opacity: 1; }
        100% { opacity: 1; transform: translateY(0); letter-spacing: 0.02em; }
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes dotHop {
        0%   { transform: translate(0px, -18px) scale(0.7); }
        35%  { transform: translate(110px, -34px) scale(1.0); }
        65%  { transform: translate(210px, -8px) scale(1.0); }
        100% { transform: translate(255px, -6px) scale(1.0); }
      }
      @keyframes pulse {
        0%,100% { transform: translate(255px, -6px) scale(1.0); }
        50% { transform: translate(255px, -6px) scale(1.12); }
      }
    ]]></style>
  </defs>
  <rect class="bg" width="800" height="220"/>
  <!-- Word -->
  <text class="word" x="80" y="140">ROTINA</text>
  <!-- Underline path (under the word) -->
  <path class="underline" d="M80,160 L620,160"/>
  <!-- Animated dot: starts near the I, hops to the end, then pulses -->
  <circle id="dot" class="dot" cx="330" cy="108" r="9"/>
</svg>
